  css.textContent='button,.btn{font-family:"Segoe UI",Arial,sans-serif!important;font-weight:700!important;letter-spacing:0!important}.tile{background-color:#fff!important;background-image:none!important;background-repeat:no-repeat!important;background-size:300% 300%!important}.tile:after{display:none!important}.vr-progress{width:min(100%,520px);margin:0 auto 14px;padding:13px 14px;border:1px solid #ffffff18;border-radius:16px;background:#091625}.vr-progress-top{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:9px;font:700 13px/1.3 "Segoe UI",Arial,sans-serif;color:#f7fbff}.vr-progress-top span{font-weight:500;color:#9db1c8}.vr-segs{display:grid;grid-template-columns:repeat(9,1fr);gap:6px}.vr-seg{height:11px;border-radius:999px;background:#ffffff12;border:1px solid #ffffff12;transition:.18s}.vr-seg.on{background:linear-gradient(135deg,#70f0c2,#68a8ff);border-color:transparent;box-shadow:0 0 13px #70f0c233}';
  d.head.appendChild(css);
  const puzzle=d.querySelector('#puzzle');if(!puzzle)return;
  const box=d.createElement('div');box.className='vr-progress';box.innerHTML='<div class="vr-progress-top"><strong>Tiến độ ghép đúng</strong><span id="vrText">0/9 mảnh đúng vị trí</span></div><div class="vr-segs" id="vrSegs"></div>';puzzle.parentNode.insertBefore(box,puzzle);
  let queued=false;
  const resize=()=>{try{frame.style.height=Math.max(700,d.documentElement.scrollHeight,d.body.scrollHeight)+'px'}catch(e){}};
  const paint=()=>{queued=false;const tiles=[...d.querySelectorAll('#puzzle .tile')];let ok=0;tiles.forEach((t,pos)=>{const piece=(Number(t.dataset.n)||1)-1,r=Math.floor(piece/3),c=piece%3;t.style.setProperty('background-image',`url("${LOGO}")`,'important');t.style.setProperty('background-position',`${c*50}% ${r*50}%`,'important');t.style.setProperty('background-size','300% 300%','important');if(piece===pos)ok++;});const text=d.getElementById('vrText'),segs=d.getElementById('vrSegs');if(text)text.textContent=`${ok}/9 mảnh đúng vị trí`;if(segs){segs.innerHTML='';for(let i=0;i<9;i++){const s=d.createElement('div');s.className='vr-seg'+(i<ok?' on':'');segs.appendChild(s);}}resize();};
  const queue=()=>{if(!queued){queued=true;w.requestAnimationFrame(paint);}};
  new MutationObserver(queue).observe(puzzle,{childList:true,subtree:true});queue();
  if(w.ResizeObserver)new w.ResizeObserver(resize).observe(d.body);w.addEventListener('resize',resize);setTimeout(resize,100);setTimeout(resize,700);
});
</script></body></html>
